[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lumbar-muscle-pro"
version = "1.0.0"
description = "Scanner-normalized paraspinal/iliopsoas muscle T2 signal and functional recovery after lumbar decompression: reproducible analysis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "pyyaml>=6.0",
    "tableone>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore::RuntimeWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Keep the lint focused on real problems, not style noise, for a research repo.
select = ["E", "F", "W", "I"]
# long lines, ambiguous l/r names, and compact one-line plotting statements are
# deliberate in this research code; keep lint focused on real defects.
ignore = ["E501", "E741", "E701", "E702"]
